name: microservices-deployment

services:
  postgresdb:
    image: postgres:16-alpine
    container_name: postgresdb
    restart: unless-stopped
    environment:
      POSTGRES_USER: postgres
      POSTGRES_PASSWORD: exam123
      POSTGRES_DB: exam2400032903
    ports:
      - "5432:5432"
    volumes:
      - postgres_data:/var/lib/postgresql/data
    healthcheck:
      test: ["CMD-SHELL", "pg_isready -U postgres -d exam2400032903"]
      interval: 5s
      timeout: 5s
      retries: 10
      start_period: 10s
    networks:
      microservices-network:
        aliases:
          - postgresdb
          - postgres-db

  exam-service:
    image: dheeraj200579/docker-skill-exam-2400032903:latest
    build:
      context: ./achievement-project
      dockerfile: Dockerfile
    container_name: exam-service
    ports:
      - "2903:2028"
    environment:
      SPRING_DATASOURCE_URL: jdbc:postgresql://postgresdb:5432/exam2400032903
      SPRING_DATASOURCE_USERNAME: postgres
      SPRING_DATASOURCE_PASSWORD: exam123
      SERVER_PORT: 2028
    depends_on:
      postgresdb:
        condition: service_healthy
    restart: unless-stopped
    networks:
      - microservices-network

volumes:
  postgres_data:

networks:
  microservices-network:
    driver: bridge
